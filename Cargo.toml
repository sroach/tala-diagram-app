[package]
name = "tala-diagram-app"
version = "0.1.0"
edition = "2021"
description = "A Rust-based web app using the TALA layout engine (via D2) to render diagrams from text, compiled to WebAssembly"
license = "MPL-2.0"
repository = "https://github.com/steveroach/tala-diagram-app"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlElement",
    "Node",
    "console",
]}
